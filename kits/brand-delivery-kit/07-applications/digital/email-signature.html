<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>[CLIENT] email signature</title>
</head>
<body>
  <!-- Table-based: many clients still hate flex/grid in signatures -->
  <table cellpadding="0" cellspacing="0" role="presentation" style="font-family:'IBM Plex Sans',Segoe UI,sans-serif;color:#0e1114;">
    <tr>
      <td style="padding-right:16px;vertical-align:middle;">
        <img src="../../06-assets/logos/png/REPLACE_mark_128.png" width="56" height="56" alt="[CLIENT]" style="display:block;border:0;" />
      </td>
      <td style="border-left:2px solid #c9a227;padding-left:16px;vertical-align:middle;">
        <p style="margin:0;font-size:15px;font-weight:700;">[Full Name]</p>
        <p style="margin:2px 0 8px;font-size:12px;color:#4a524c;">[Role] · [CLIENT]</p>
        <p style="margin:0;font-size:12px;line-height:1.5;">
          <a href="tel:" style="color:#0e1114;text-decoration:none;">[phone]</a><br />
          <a href="mailto:[email]" style="color:#0e1114;text-decoration:none;">[email]</a><br />
          <a href="https://" style="color:#3d5a45;text-decoration:none;">[website]</a>
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
