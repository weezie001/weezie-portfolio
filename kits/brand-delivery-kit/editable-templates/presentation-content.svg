<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Your Studio / Presentation / content</title><rect x="0" y="0" width="1600" height="900" fill="#e7e3d6"/><text x="70" y="85" fill="#3d5a45" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">THE APPROACH / 02</text><text x="70" y="205" fill="#3d5a45" font-family="Georgia,serif" font-size="68" >Your Studio</text><text x="70" y="290" fill="#3d5a45" font-family="Georgia,serif" font-size="68" >Care is in the details.</text><rect x="70" y="365" width="1460" height="1" fill="#3d5a45"/><text x="70" y="445" fill="#3d5a45" font-family="Arial,sans-serif" font-size="18" >01</text><text x="70" y="555" fill="#3d5a45" font-family="Georgia,serif" font-size="45" >Material</text><text x="70" y="620" fill="#0e1114" font-family="Arial,sans-serif" font-size="21" >Choose honest materials.</text><text x="70" y="658" fill="#0e1114" font-family="Arial,sans-serif" font-size="21" >Let their character show.</text><text x="580" y="445" fill="#3d5a45" font-family="Arial,sans-serif" font-size="18" >02</text><text x="580" y="555" fill="#3d5a45" font-family="Georgia,serif" font-size="45" >Method</text><text x="580" y="620" fill="#0e1114" font-family="Arial,sans-serif" font-size="21" >Be precise about the work.</text><text x="580" y="658" fill="#0e1114" font-family="Arial,sans-serif" font-size="21" >Make every detail earn its place.</text><text x="1090" y="445" fill="#3d5a45" font-family="Arial,sans-serif" font-size="18" >03</text><text x="1090" y="555" fill="#3d5a45" font-family="Georgia,serif" font-size="45" >Meaning</text><text x="1090" y="620" fill="#0e1114" font-family="Arial,sans-serif" font-size="21" >Build for the everyday.</text><text x="1090" y="658" fill="#0e1114" font-family="Arial,sans-serif" font-size="21" >Make something worth keeping.</text><rect x="70" y="805" width="1460" height="1" fill="#3d5a45"/><text x="70" y="850" fill="#3d5a45" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">YOURSTUDIO.EXAMPLE</text></svg>