<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="794" height="1123" viewBox="0 0 794 1123" role="img"><title>Your Studio / Proposal / scope</title><rect x="0" y="0" width="794" height="1123" fill="#e7e3d6"/><g transform="translate(55 45) scale(0.525)" fill="#3d5a45"><path d="M8 68V27L40 8l32 19v41H58V35L40 24 22 35v33Z"/><path d="M34 43h12v25H34Z"/></g><text x="113.8" y="72.3" fill="#3d5a45" font-family="Georgia,serif" font-size="27.3" >Your Studio</text><text x="55" y="181" fill="#3d5a45" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">THE SCOPE / 02</text><text x="55" y="245" fill="#3d5a45" font-family="Georgia,serif" font-size="47" >What we will make.</text><rect x="55" y="283" width="684" height="1" fill="#3d5a45"/><text x="55" y="358" fill="#3d5a45" font-family="Arial,sans-serif" font-size="13" >01</text><text x="125" y="358" fill="#3d5a45" font-family="Georgia,serif" font-size="29" >Direction</text><text x="125" y="399" fill="#0e1114" font-family="Arial,sans-serif" font-size="15" >A shared creative direction, audience and message.</text><rect x="125" y="431" width="614" height="1" fill="#c0c7b8"/><text x="55" y="494" fill="#3d5a45" font-family="Arial,sans-serif" font-size="13" >02</text><text x="125" y="494" fill="#3d5a45" font-family="Georgia,serif" font-size="29" >Identity</text><text x="125" y="535" fill="#0e1114" font-family="Arial,sans-serif" font-size="15" >An approved logo system, palette and type rules.</text><rect x="125" y="567" width="614" height="1" fill="#c0c7b8"/><text x="55" y="630" fill="#3d5a45" font-family="Arial,sans-serif" font-size="13" >03</text><text x="125" y="630" fill="#3d5a45" font-family="Georgia,serif" font-size="29" >Applications</text><text x="125" y="671" fill="#0e1114" font-family="Arial,sans-serif" font-size="15" >The agreed print, campaign and digital artwork.</text><rect x="125" y="703" width="614" height="1" fill="#c0c7b8"/><text x="55" y="766" fill="#3d5a45" font-family="Arial,sans-serif" font-size="13" >04</text><text x="125" y="766" fill="#3d5a45" font-family="Georgia,serif" font-size="29" >Handover</text><text x="125" y="807" fill="#0e1114" font-family="Arial,sans-serif" font-size="15" >Organized files, exports and a client walkthrough.</text><rect x="125" y="839" width="614" height="1" fill="#c0c7b8"/><rect x="55" y="969" width="684" height="1" fill="#3d5a45"/><text x="55" y="1009" fill="#3d5a45" font-family="Arial,sans-serif" font-size="12" >Sample scope only. Agree fees, dates and terms separately.</text><text x="55" y="1060" fill="#3d5a45" font-family="Arial,sans-serif" font-size="12" >yourstudio.example</text></svg>