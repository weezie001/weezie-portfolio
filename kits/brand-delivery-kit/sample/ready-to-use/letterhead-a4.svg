<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="794" height="1123" viewBox="0 0 794 1123" role="img"><title>Atelier North / Letterhead</title><rect x="0" y="0" width="794" height="1123" fill="#fcfbf7"/><g transform="translate(55 50) scale(0.65)" fill="#3d5a45"><path d="M8 68V27L40 8l32 19v41H58V35L40 24 22 35v33Z"/><path d="M34 43h12v25H34Z"/></g><text x="125" y="87" fill="#0e1114" font-family="Georgia,serif" font-size="33" >Atelier North</text><text x="55" y="147" fill="#3d5a45" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">OBJECTS FOR CONSIDERED LIVING</text><rect x="55" y="180" width="684" height="1" fill="#3d5a45"/><text x="55" y="250" fill="#3d5a45" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">CORRESPONDENCE / 001</text><text x="55" y="318" fill="#3d5a45" font-family="Georgia,serif" font-size="29" >To the people who make a place their own.</text><text x="55" y="390" fill="#0e1114" font-family="Arial,sans-serif" font-size="17" >Dear Client,</text><text x="55" y="438" fill="#0e1114" font-family="Arial,sans-serif" font-size="16" >Good work begins with a clear understanding.</text><text x="55" y="470" fill="#0e1114" font-family="Arial,sans-serif" font-size="16" >Use this space for a personal note, project update or formal letter.</text><text x="55" y="502" fill="#0e1114" font-family="Arial,sans-serif" font-size="16" >Replace this sample copy with your own message before delivery.</text><text x="55" y="534" fill="#0e1114" font-family="Arial,sans-serif" font-size="16" >Keep body text on the grid and leave the margins clear.</text><text x="55" y="710" fill="#0e1114" font-family="Arial,sans-serif" font-size="17" >With care,</text><text x="55" y="750" fill="#3d5a45" font-family="Georgia,serif" font-size="25" >Alex Morgan</text><text x="55" y="778" fill="#3d5a45" font-family="Arial,sans-serif" font-size="13" >Founder / Maker</text><rect x="55" y="1005" width="684" height="1" fill="#3d5a45"/><text x="55" y="1038" fill="#3d5a45" font-family="Arial,sans-serif" font-size="12" >hello@ateliernorth.example</text><text x="55" y="1061" fill="#3d5a45" font-family="Arial,sans-serif" font-size="12" >ateliernorth.example</text><text x="460" y="1038" fill="#3d5a45" font-family="Arial,sans-serif" font-size="11" >By appointment / Working worldwide</text></svg>