<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Client Intake Form | Enang Weezie</title>
<meta name="description" content="Project questionnaire from Enang Weezie. Your answers go straight to Enang.">
<meta name="theme-color" content="#e9ebf1">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same palette as the portfolio (src/index.css), with a dark variant. */
:root {
  --paper: #e9ebf1; --card: #f6f7fa; --ink: #0c0d10; --ink-soft: #4a4f5c; --line: #d3d7e0;
  --blue: #2f6bff; --blue-ink: #ffffff; --blue-tint: #e3ebff; --danger: #c2372f; --ok: #1f8a4c;
  --shadow: 0 1px 2px rgba(12,13,16,.06), 0 8px 24px rgba(12,13,16,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #0f1115; --card: #171a20; --ink: #eef0f5; --ink-soft: #a3a9b6; --line: #2a2f39;
          --blue: #5b8cff; --blue-ink: #0b0d12; --blue-tint: #1b2440; --danger: #ff7a70; --ok: #4fd18b;
          --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 Onest, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom)); }
.brand { display: flex; align-items: center; gap: 10px; font: 800 15px/1 "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); display: inline-block; }
h1 { font: 800 clamp(28px, 7vw, 38px)/1.1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: -.02em; margin: 28px 0 8px; text-wrap: balance; }
.sub { color: var(--ink-soft); font-weight: 600; margin: 0 0 24px; padding-bottom: 20px; border-bottom: 2px solid var(--ink); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px 18px 24px; box-shadow: var(--shadow); margin-bottom: 16px; }
.card h2 { font: 800 19px/1.25 "JetBrains Mono", ui-monospace, monospace; letter-spacing: -.01em; margin: 0; }
.q { margin-top: 18px; }
.q label { display: block; font-weight: 600; margin-bottom: 8px; }
.req { color: var(--blue); font-weight: 700; margin-left: 2px; }
input, textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 12px 14px; min-height: 48px; outline: none; transition: border-color .15s, box-shadow .15s; }
textarea { min-height: 88px; resize: vertical; }
input:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-tint); }
.err { color: var(--danger); font-size: 14px; margin: 6px 0 0; display: none; }
.q.bad .err { display: block; }
.q.bad input, .q.bad textarea { border-color: var(--danger); }
.btn { font: 700 16px/1 Onest, system-ui, sans-serif; border-radius: 999px; padding: 16px 24px; min-height: 52px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.btn.primary { width: 100%; background: var(--blue); border-color: var(--blue); color: var(--blue-ink); margin-top: 8px; }
.btn:disabled { opacity: .6; cursor: default; }
.note { font-size: 13px; color: var(--ink-soft); margin: 12px 2px 0; text-align: center; }
.alert { margin-top: 14px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--danger); color: var(--danger); }
.done .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 28px; margin-bottom: 14px; }
.done h2 { margin-bottom: 8px; }
.done p { color: var(--ink-soft); }
.done pre { white-space: pre-wrap; word-break: break-word; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 14px 0 0; font: 13px/1.5 "JetBrains Mono", ui-monospace, monospace; max-height: 280px; overflow: auto; }
.foot { margin-top: 28px; font-size: 13px; color: var(--ink-soft); }
.foot a { color: inherit; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <a class="brand" href="/"><i></i>Enang Weezie</a>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>

  <form id="form" novalidate>
    <div id="sections"></div>
    <div class="alert" id="sendError" role="alert" hidden></div>
    <button type="submit" class="btn primary" id="submit">Submit</button>
    <p class="note">Your answers save on this device as you type, so you can come back and finish later.</p>
  </form>

  <section class="card done" id="done" hidden>
    <div class="tick" aria-hidden="true">✓</div>
    <h2>Thank you, it's sent.</h2>
    <p id="closing"></p>
    <button type="button" class="btn" id="copyBtn">Copy my answers</button>
    <pre id="summary" aria-label="Your answers"></pre>
  </section>

  <p class="foot">Questions? Email <a href="mailto:enangweezie@gmail.com">enangweezie@gmail.com</a> or reply in our chat.</p>
</main>

<script>
// The questions. Answers post to the same Formspree form as the portfolio's contact form (src/data.js formEndpoint).
const FORM = {
  title: 'Client Intake Form',
  sub: 'Digital storefront: weight loss and menopause modules',
  closing: "Your answers are with me now. I'll review them and get back to you within 24 hours with a plan and a quote.",
  sections: [
    ['Your details', [['name', 'Name', 'text', true], ['contact', 'Email / WhatsApp', 'text', true]]],
    ['1. Products', [
      ['modules', 'How many modules are there, and are they finished?'],
      ['format', 'What format are they (PDF, video, audio)?'],
      ['packaging', 'Sell individually, as bundles, or as one full program?'],
      ['prices', 'Do you have prices in mind?'],
    ]],
    ['2. Audience', [
      ['audience', 'Who exactly is this for (age, country, stage)?'],
      ['channels', 'Where do they find you (Instagram, TikTok, email list)?'],
      ['following', 'How big is your following or email list?'],
      ['testimonials', 'Do you have testimonials or results to show?'],
    ]],
    ['3. Branding', [
      ['brand', 'Do you have a logo, brand colors, and a program name?'],
      ['media', 'Do you have photos or videos of yourself to use?'],
    ]],
    ['4. Payments and legal', [
      ['countries', 'Which country are you in, and where are most buyers?'],
      ['payment_methods', 'Which payment methods and currencies do you need?'],
      ['stripe_paypal', 'Do you already have a Stripe or PayPal account?'],
      ['policies', 'Do you have terms, refund and privacy policies, and health disclaimers?'],
    ]],
    ['5. Delivery and email', [
      ['delivery', 'Instant download link, or a login members area?'],
      ['email_tool', 'Do you use an email tool (Mailchimp, Kit)? Want a free lead magnet?'],
      ['emails', 'Which emails: welcome, receipt, abandoned cart, follow-up?'],
    ]],
    ['6. CRM / admin page', [
      ['admin_view', 'What must you see: sales, customers, revenue, refunds?'],
      ['admin_access', 'Who else needs access?'],
    ]],
    ['7. Logistics', [
      ['launch_budget', 'What is your launch date and budget?'],
      ['domain_support', 'Do you have a domain? Do you need support after launch?'],
    ]],
  ],
}
const ENDPOINT = 'https://formspree.io/f/xlgqezad'
const STORE = 'weezie-intake-v1'
const $ = s => document.querySelector(s)

$('#title').textContent = FORM.title
$('#sub').textContent = FORM.sub
$('#closing').textContent = FORM.closing

const host = $('#sections')
for (const [title, qs] of FORM.sections) {
  const card = document.createElement('section')
  card.className = 'card'
  const h = document.createElement('h2')
  h.textContent = title
  card.appendChild(h)
  for (const [id, label, type = 'textarea', required = false] of qs) {
    const q = document.createElement('div')
    q.className = 'q'
    q.dataset.label = label
    q.dataset.section = title
    if (required) q.dataset.required = '1'
    const lab = document.createElement('label')
    lab.htmlFor = 'f_' + id
    lab.textContent = label
    if (required) lab.insertAdjacentHTML('beforeend', '<span class="req" aria-hidden="true">*</span>')
    const field = document.createElement(type === 'textarea' ? 'textarea' : 'input')
    field.id = 'f_' + id
    field.name = id
    if (type === 'textarea') field.rows = 3
    else { field.type = type; field.autocomplete = id === 'name' ? 'name' : 'off' }
    if (required) field.required = true
    field.setAttribute('aria-describedby', 'e_' + id)
    const err = document.createElement('p')
    err.className = 'err'
    err.id = 'e_' + id
    err.textContent = 'Please fill this in.'
    q.append(lab, field, err)
    card.appendChild(q)
  }
  host.appendChild(card)
}
const fields = [...host.querySelectorAll('input, textarea')]

// Autosave, so a client who switches back to the chat app doesn't lose answers.
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || '{}')
  fields.forEach(f => { if (saved[f.name]) f.value = saved[f.name] })
} catch (_) { /* storage blocked: the form still works */ }
host.addEventListener('input', e => {
  e.target.closest('.q')?.classList.remove('bad')
  try { localStorage.setItem(STORE, JSON.stringify(Object.fromEntries(fields.map(f => [f.name, f.value])))) } catch (_) {}
})

function summaryText() {
  let out = '', last = ''
  for (const f of fields) {
    const q = f.closest('.q')
    if (q.dataset.section !== last) { out += (out ? '\n' : '') + q.dataset.section.toUpperCase() + '\n'; last = q.dataset.section }
    out += `${q.dataset.label}\n  ${f.value.trim() || '(skipped)'}\n`
  }
  return out.trim()
}

$('#form').addEventListener('submit', async e => {
  e.preventDefault()
  const missing = fields.filter(f => f.required && !f.value.trim())
  fields.forEach(f => f.closest('.q').classList.toggle('bad', missing.includes(f)))
  if (missing.length) {
    missing[0].focus({ preventScroll: true })
    missing[0].scrollIntoView({ behavior: 'smooth', block: 'center' })
    return
  }
  const btn = $('#submit')
  btn.disabled = true
  btn.textContent = 'Sending...'
  $('#sendError').hidden = true
  const name = $('#f_name').value.trim()
  const contact = $('#f_contact').value.trim()
  const payload = { _subject: `Client intake: ${name}`, form: 'Client intake (storefront)', name, contact }
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact)) { payload.email = contact; payload._replyto = contact }
  fields.forEach(f => { if (!(f.name in payload)) payload[f.closest('.q').dataset.label] = f.value.trim() || '(skipped)' })
  payload.summary = summaryText()
  try {
    const res = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(payload) })
    if (!res.ok) throw new Error('HTTP ' + res.status)
    $('#summary').textContent = summaryText()
    $('#form').hidden = true
    $('#done').hidden = false
    window.scrollTo({ top: 0, behavior: 'smooth' })
    try { localStorage.removeItem(STORE) } catch (_) {}
  } catch (_) {
    const box = $('#sendError')
    box.textContent = 'Sorry, that did not send. Your answers are still saved here. Please try again, or copy your answers below and paste them into our chat.'
    box.hidden = false
    $('#summary').textContent = summaryText()
    $('#done').hidden = false
    $('#done h2').textContent = 'Your answers'
    $('#done .tick').hidden = true
    $('#closing').textContent = 'Copy these and paste them into our chat.'
    btn.disabled = false
    btn.textContent = 'Try again'
  }
})

$('#copyBtn').addEventListener('click', async e => {
  const text = $('#summary').textContent
  try { await navigator.clipboard.writeText(text); e.target.textContent = 'Copied. Paste it in our chat.' }
  catch (_) {
    const r = document.createRange(); r.selectNodeContents($('#summary'))
    const s = getSelection(); s.removeAllRanges(); s.addRange(r)
    e.target.textContent = 'Selected. Copy it and paste in our chat.'
  }
})
</script>
</body>
</html>
